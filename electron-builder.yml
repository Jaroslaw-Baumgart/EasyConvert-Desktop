appId: com.jaroslawbaumgart.easyconvert
productName: EasyConvert

directories:
  output: release

files:
  - dist/desktop/**/*
  - dist/conversion-core/**/*
  - client/dist/**/*
  - package.json

extraResources:
  - from: tools/libreoffice
    to: libreoffice
    filter:
      - "**/*"

  - from: server/node_modules/pdf-poppler/lib/win/poppler-0.51
    to: poppler
    filter:
      - "**/*"

  - from: server/src/assets/fonts
    to: fonts
    filter:
      - "**/*"

asar: true

asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

win:
  executableName: EasyConvert
