appId: com.jaroslawbaumgart.easyconvert
productName: EasyConvert

directories:
  output: release

files:
  - dist/desktop/**/*
  - dist/conversion-core/**/*
  - dist/shared/**/*
  - client/dist/**/*
  - package.json

extraResources:
  - from: client/dist/THIRD-PARTY-LICENSES.txt
    to: licenses/CLIENT-LICENSES.txt

  - from: tools/licenses/NPM-LICENSES.txt
    to: licenses/NPM-LICENSES.txt

  - from: assets/licenses/sharp
    to: licenses/sharp

  - from: assets/licenses/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

  - from: LICENSE
    to: LICENSE.txt

  - from: assets/icons/easyconvert-black.ico
    to: icons/easyconvert-black.ico

  - from: tools/libreoffice
    to: libreoffice
    filter:
      - "**/*"

  - from: tools/poppler
    to: poppler
    filter:
      - "**/*"

  - from: assets/fonts
    to: fonts
    filter:
      - "**/*"

asar: true

asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

win:
  icon: assets/icons/easyconvert-black.ico
  executableName: EasyConvert
  target:
    - target: nsis
      arch:
        - x64

nsis:
  useZip: true
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyConvert
  deleteAppDataOnUninstall: false
  artifactName: EasyConvert-Setup-${version}.${ext}
