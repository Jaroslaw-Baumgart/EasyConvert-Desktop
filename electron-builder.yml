appId: com.jaroslawbaumgart.easyconvert
productName: EasyConvert

directories:
  output: release

files:
  - dist/desktop/**/*
  - dist/conversion-core/**/*
  - dist/shared/**/*
  - client/dist/**/*
  - package.json

extraResources:
  - from: assets/icons/easyconvert-black.ico
    to: icons/easyconvert-black.ico

  - from: tools/libreoffice
    to: libreoffice
    filter:
      - "**/*"

  - from: node_modules/pdf-poppler/lib/win/poppler-0.51
    to: poppler
    filter:
      - "**/*"

  - from: assets/fonts
    to: fonts
    filter:
      - "**/*"

asar: true

asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

win:
  icon: assets/icons/easyconvert-black.ico
  executableName: EasyConvert
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyConvert
  deleteAppDataOnUninstall: false
  artifactName: EasyConvert-Setup-${version}.${ext}
