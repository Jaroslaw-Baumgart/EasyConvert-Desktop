name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci
      - run: npm ci --prefix client
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress
      - run: npm run check
        env:
          LIBRE_OFFICE_PATH: /usr/bin/libreoffice
      - run: npm run typecheck:e2e

  e2e:
    name: Desktop end-to-end tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci
      - run: npm ci --prefix client
      - name: Install LibreOffice for desktop conversions
        shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "LibreOffice installation failed." }
          New-Item -ItemType Directory -Path tools/libreoffice -Force | Out-Null
          Copy-Item -Path 'C:/Program Files/LibreOffice/*' -Destination tools/libreoffice -Recurse
          if (!(Test-Path tools/libreoffice/program/soffice.com)) { throw "LibreOffice executable is missing." }
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/**/*.png
            test-results/**/trace.zip
            test-results/**/electron.log
          if-no-files-found: ignore
